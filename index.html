const SC=[sCover,sIntro,h1s1,h1s2,h1s3,h2s1,h2s2,h2s3,h3s1,h3s2,h3s3,h4s1,h4s2,h4s3];
const cv=document.getElementById('cv'),scaler=document.getElementById('scaler'),stepi=document.getElementById('stepi');
let cur=-1,tmr;
function show(i){
  i=Math.max(0,Math.min(SC.length-1,i));cur=i;
  cv.innerHTML=SC[i]();
  const a=AN[i];
  if(a){cv.insertAdjacentHTML('beforeend',`<div class="anno"><div class="an">${a.n}</div><div class="ab"><div class="ah">${a.h}</div><div class="at">${a.t}</div><div class="ad">${a.d}</div><div class="ap2">${a.p.map(x=>'<span>'+x+'</span>').join('')}</div></div><div class="nav"><b onclick="event.stopPropagation();show(cur-1)">←</b><span>${i+1}/${SC.length}</span><b onclick="event.stopPropagation();show(cur+1)">→</b></div></div>`)}
  stepi.textContent=a?'':`${i+1} / ${SC.length}`;stepi.classList.remove('fade');clearTimeout(tmr);tmr=setTimeout(()=>stepi.classList.add('fade'),1400);
  try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
}
function fit(){const col=scaler.parentElement.clientWidth;const s=Math.min(col/1440,(innerHeight-32)/880);scaler.style.width=(1440*s)+'px';scaler.style.height=(880*s)+'px';cv.style.transform=`scale(${s})`}
addEventListener('resize',fit);new ResizeObserver(fit).observe(scaler.parentElement);fit();
scaler.addEventListener('click',()=>show(cur+1));
addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();show(cur+1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();if(cur>0)show(cur-1)}
  else if(e.key==='Home'){e.preventDefault();show(0)}
});
let q=null;try{q=new URLSearchParams(location.search).get('s')}catch(e){}
q=q||(location.hash.match(/^#s(\d+)$/)||[])[1];
show(q?+q-1:0);
